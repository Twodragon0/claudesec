# Security Scan Gate
# Runs the full ClaudeSec scanner pipeline and audits the generated dashboard.
# Triggers: push/PR to main, and every Monday at 09:00 UTC.
#
# Jobs:
#   scan      — Build the Docker image, run the scanner, generate the dashboard,
#               upload it as an artifact, and gate on critical findings.
#   lighthouse — Download the dashboard artifact, serve it locally, and audit
#               performance + accessibility with Lighthouse.

name: Security Scan Gate

on:
  push:
    branches: [main]
  # No `branches:` filter: a stacked PR (base = another feature branch)
  # must still get this REQUIRED check. With `branches: [main]` it never
  # ran at all — PR #384 saw 3 checks and neither required context;
  # the same branch retargeted to main (#385) saw 28. Unlike the #186
  # `paths-ignore` incident, widening here cannot block a merge: PRs
  # targeting `main` are unaffected, so the required contexts always
  # report. Pinned by scanner/tests/test_ci_pr_trigger_scope.py.
  pull_request:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job: changes
  # Detects whether the diff contains anything that could affect the scanner /
  # dashboard / runtime. Docs-only PRs short-circuit `scan` and `lighthouse`,
  # while `security-scan-gate` ALWAYS runs so the required-status-check is
  # still emitted (otherwise paths-ignore at the workflow level would block
  # branch-protected merges of docs PRs — see #185 incident).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          NULL_SHA: "0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fetch the PR base WITH ancestry (not --depth=1): a shallow single
            # commit has no parents locally, so the three-dot merge-base diff dies
            # with "fatal: no merge base" whenever the branch is behind its base
            # (a moving main), which HARD-FAILS this job and cascades to the
            # REQUIRED `Security Scan Gate`. Same fix already proven in lint.yml.
            # Fall back to a two-endpoint diff (needs no merge base;
            # over-inclusive is fail-safe for a path gate) then HEAD~1.
            git fetch origin "$BASE_SHA" >/dev/null 2>&1 \
              || git fetch origin "$BASE_SHA" --depth=1 >/dev/null 2>&1 || true
            FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null \
                    || git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null \
                    || git diff --name-only HEAD~1..HEAD)
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$NULL_SHA" ]; then
            git fetch origin "$BEFORE_SHA" --depth=1 >/dev/null 2>&1 || true
            FILES=$(git diff --name-only "$BEFORE_SHA"..HEAD 2>/dev/null \
                    || git diff --name-only HEAD~1..HEAD)
          else
            FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"
          echo "$FILES"
          # `code=true` when at least one changed file is meaningful runtime
          # input to the scanner. The classification is:
          #
          #   - SAFE-SKIP (do not trigger scan):
          #       docs/**, **/*.md, .cursor/**, .claude/**, CODEOWNERS, LICENSE,
          #       .github/workflows/*.yml  (other workflow files cannot change
          #       scanner/dashboard runtime — see PR #184 incident where editing
          #       dependabot-auto-merge.yml triggered an unrelated 3m20s scan)
          #
          #   - ALWAYS-TRIGGER (force scan revalidation):
          #       .github/workflows/security-scan.yml  (this workflow itself —
          #       any change to gating logic must re-run the heavy scan)
          #
          #   - REAL CODE (trigger scan):
          #       scanner/, scripts/, hooks/, Dockerfile, docker-compose*,
          #       requirements*.txt, etc. — anything outside the safe-skip set.
          self_edit=$(printf '%s\n' "$FILES" | grep -E '^\.github/workflows/security-scan\.yml$' || true)
          non_safe=$(printf '%s\n' "$FILES" | grep -vE '^(docs/|.*\.md$|\.cursor/|\.claude/|CODEOWNERS$|LICENSE$|\.github/workflows/[^/]+\.ya?ml$)' || true)
          if [ -n "$self_edit" ] || [ -n "$non_safe" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job: scan
  # Builds the claudesec Docker image, executes the full security scan, and
  # generates the HTML dashboard.  Fails the workflow on any CRITICAL finding.
  # ---------------------------------------------------------------------------
  scan:
    name: Run Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Build the scanner image from the repo's Dockerfile so the scan always
      # reflects the current scanner version rather than a cached registry image.
      - name: Build scanner image
        run: docker build -t claudesec:local .

      # Run the full scan suite and tee output so we can gate on severity below.
      - name: Run full security scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e SCAN_DIR=/workspace \
            claudesec:local scan -d /workspace -c all \
            | tee scan-output.txt

      # Generate the standalone HTML dashboard (--no-serve exits after writing
      # the file rather than starting a long-lived HTTP server).
      # CLAUDESEC_DASHBOARD_OFFLINE=1 skips GitHub API calls for best-practice
      # content (audit-points, MS/SaaS repos) that block indefinitely in CI
      # due to unauthenticated rate-limits (60 req/hr) and retry back-off sleeps.
      - name: Generate dashboard
        timeout-minutes: 3
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SCAN_DIR=/workspace \
            -e HOME=/tmp \
            -e CLAUDESEC_DASHBOARD_OFFLINE=1 \
            claudesec:local dashboard -d /workspace -c all --no-serve
          ls -la "${{ github.workspace }}/claudesec-dashboard.html" || echo "Dashboard file not found in workspace"

      # Upload the dashboard so the lighthouse job (and humans) can download it.
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: security-dashboard
          path: "${{ github.workspace }}/claudesec-dashboard.html"
          retention-days: 30
          # VERDICT SUPPRESSED — WHAT IT HIDES: if the dashboard was never written,
          # this step warns instead of failing. The loss is deferred, not avoided:
          # the downstream `lighthouse` job then fails on the missing artifact
          # instead, so the signal survives but points at the wrong job. `warn`
          # (not `error`) is kept because `lighthouse` is the better place to fail.
          if-no-files-found: warn

      # Gate: count critical/high findings from scan output.
      # Any CRITICAL finding FAILS the build (blocks merge via the Security Scan
      # Gate required check); HIGH findings are surfaced as warnings only.
      #
      # POSITIVE CONTROL ON THE INPUT (added 2026-08-13, audit 2026-08-12). Until
      # this PR the gate could not tell "zero criticals" from "no parseable scan
      # output", and every indistinguishable case read GREEN on the REQUIRED
      # `Security Scan Gate`. Measured by running the old step body verbatim
      # (`bash -eo pipefail`, plus the guard's plain `bash`):
      #   scan-output.txt missing -> `Critical: , High: ` + `[: : integer
      #     expression expected` TWICE, step exit 0. The `[` errors are non-fatal
      #     because they sit in an `if` CONDITION, where `set -e` does not apply.
      #   scan-output.txt empty   -> `Critical: 0, High: 0`, step exit 0.
      #   glyph/wording drift     -> `[X] Critical severity: ...` scores 0, exit 0.
      #   real production output  -> `Critical: 0` on a report whose own severity
      #     breakdown says `CRITICAL  1`, step exit 0. scanner/lib/checks.sh
      #     sources every check with stdout on /dev/null, so the per-finding
      #     `✗ FAIL ... (critical)` line the counters look for never reaches
      #     scan-output.txt at all — only print_summary's breakdown survives.
      #   one real CRITICAL       -> exit 1 (the gate works on its happy path).
      # The four preconditions below make each of those a LOUD, SPECIFIC failure
      # that says the input was unusable — which is a different verdict from
      # "the scan was clean". Same class as #396/#397 (a no-op job reads green)
      # and PR #412 (a stray `working-directory: docs` producing `Critical: `).
      # Proven by execution, in both directions, by
      # scanner/tests/test_ci_security_gate_behaviour.py.
      # HIGH findings are warn-only by design (see ::warning:: below).
      - name: Check for critical/high failures
        run: |
          # PRECONDITION 1 of 4 — the input must exist and be non-empty.
          if [ ! -s scan-output.txt ]; then
            echo "::error::UNUSABLE SCAN INPUT: scan-output.txt is missing or empty, so this gate counted nothing. That is NOT a clean scan — the scan did not deliver a report. Failing closed."
            exit 1
          fi
          # PRECONDITION 2 of 4 — it must be a COMPLETE claudesec report.
          # print_summary in scanner/lib/output.sh always emits this sentinel, so
          # its absence means the run crashed, was truncated, went to stderr, was
          # read from the wrong directory, or the report format changed under this
          # gate. Note the scan step pipes docker into tee under `bash -e` without
          # pipefail, so a crashed scanner already exits 0 there. Sentinel pinned
          # to the emitter by scanner/tests/test_ci_security_gate_behaviour.py.
          if ! grep -q 'Security Score' scan-output.txt; then
            echo "::error::UNUSABLE SCAN INPUT: scan-output.txt has no 'Security Score' summary line, so it is not a complete claudesec report. That is NOT a clean scan. Failing closed."
            exit 1
          fi
          CRITS=$(grep -ci '✗.*critical\|CRITICAL.*Fail' scan-output.txt || true)
          HIGHS=$(grep -ci '✗.*high\|HIGH.*Fail' scan-output.txt || true)
          # PRECONDITION 3 of 4 — the counters must have produced NUMBERS. This is
          # the arm that closes the original mechanism directly. The fallback to
          # `true` on both greps is REQUIRED, because grep exits 1 on zero
          # matches, and it is not the defect. What was missing is this control on
          # the RESULT. `${VAR##*[!0-9]*}` is empty when VAR is empty or holds any
          # non-digit, and the comparison is a STRING test, so this arm cannot
          # itself error out and be swallowed the way `-gt` was.
          if [ -z "${CRITS##*[!0-9]*}" ] || [ -z "${HIGHS##*[!0-9]*}" ]; then
            echo "::error::UNUSABLE SCAN VERDICT: the severity counters produced no number (Critical='$CRITS' High='$HIGHS'), so nothing was actually counted. That is NOT a clean scan. Failing closed."
            exit 1
          fi
          # PRECONDITION 4 of 4 — a zero count is trustworthy only when the report
          # itself declares zero. print_summary renders an INDEPENDENT severity
          # breakdown, so a report that declares CRITICALs the counters scored as
          # 0 means the count pattern is blind, not that the scan was clean. This
          # is what distinguishes "zero criticals" from "no count found".
          if [ "$CRITS" = "0" ] && grep -q 'CRITICAL  *[0-9].*Immediate action required' scan-output.txt; then
            echo "::error::UNUSABLE SCAN VERDICT: the report's own severity breakdown declares CRITICAL findings that this gate scored as 0 — the count pattern no longer matches what the scanner emits. That is NOT a clean scan. Failing closed."
            exit 1
          fi
          echo "Critical: $CRITS, High: $HIGHS"
          echo "::notice::Security scan completed — Critical: $CRITS, High: $HIGHS"
          if [ "$HIGHS" -gt 0 ]; then
            # HIDES: every HIGH-severity finding. Only CRITICAL blocks a merge, so
            # an unbounded number of HIGHs ships green on the required check.
            # Deliberate, because scanner HIGHs include advisory checks. The only
            # record of them is this annotation plus scan-output.txt in the run log.
            echo "::warning::$HIGHS high finding(s) detected"
          fi
          if [ "$CRITS" -gt 0 ]; then
            echo "::error::$CRITS critical finding(s) detected — failing the build (review scan-output.txt)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job: lighthouse
  # Downloads the generated dashboard artifact, serves it over HTTP, and runs
  # Lighthouse to audit performance and accessibility.  Scores below threshold
  # emit a warning annotation but do not fail the workflow.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse Audit
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Retrieve the dashboard HTML produced by the scan job.
      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: security-dashboard

      # Serve the dashboard on port 8080 and run Lighthouse against it.
      # PR-time signal on the freshly-built dashboard (single run → noisy), so
      # this stays a ::warning:: only. The hard Performance/SEO/A11y gate at
      # >= 0.90 runs against the live deployed Pages in lighthouse.yml.
      # Thresholds: Performance >= 90, Accessibility >= 90.
      - name: Serve and audit
        run: |
          python3 -m http.server 8080 &
          sleep 2

          npx lighthouse http://localhost:8080/claudesec-dashboard.html \
            --output=json --output-path=lighthouse.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility

          PERF=$(python3 -c "import json;d=json.load(open('lighthouse.json'));print(int(d['categories']['performance']['score']*100))")
          A11Y=$(python3 -c "import json;d=json.load(open('lighthouse.json'));print(int(d['categories']['accessibility']['score']*100))")

          echo "Performance: $PERF, Accessibility: $A11Y"

          if [ "$PERF" -lt 90 ] || [ "$A11Y" -lt 90 ]; then
            # HIDES: a Performance/Accessibility regression on the freshly-built
            # dashboard. Warn-only ON PURPOSE, because a single Lighthouse run is
            # noisy. The hard >= 0.90 gate lives in lighthouse.yml on deployed Pages.
            # What is genuinely lost: a regression that only reproduces on the
            # PR-built artifact and not on the deployed site has no blocking gate.
            echo "::warning::Dashboard quality below threshold (Perf=$PERF, A11y=$A11Y)"
          fi

  security-scan-gate:
    name: Security Scan Gate
    # if: always() ensures this gate emits a status check even when `scan` and
    # `lighthouse` are skipped because changes.code=false. Branch protection
    # treats `skipped` as a passing dependency (see Python check below).
    if: always()
    needs:
      - changes
      - scan
      - lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate security scan workflow results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] not in ("success", "skipped")
          }
          if bad:
              print(f"Security Scan Gate failed: {bad}")
              sys.exit(1)
          print("Security Scan Gate passed.")
          PY
