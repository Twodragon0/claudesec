name: Dependabot Auto-Merge

# pull_request_target is required so that Dependabot PRs receive a
# write-scoped GITHUB_TOKEN (Dependabot runs with read-only by default).
# CRITICAL: We do NOT check out the PR head and do NOT execute any code
# from the PR branch — the workflow only calls `gh` CLI against the PR
# metadata and triggers GitHub's server-side auto-merge arm.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege: auto-merge requires contents:write to arm the GitHub
# auto-merge feature; pull-requests:write to post informational comments.
# No other permissions are granted.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-arm Dependabot PR (human code-owner approval required)
    runs-on: ubuntu-latest

    # Defense-in-depth fork guard: only run when the PR head lives in THIS
    # repo (not a fork) and the actor is dependabot[bot].
    # pull_request_target grants write tokens — never let a fork trigger this.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gather the list of files changed in this PR for path-based exclusion.
      # PR_URL is passed via env var (never interpolated directly into shell).
      #
      # THE PREVIOUS COMMENT HERE CLAIMED THIS WAS FAIL-CLOSED. IT WAS NOT.
      # It said "if `gh` errors we emit an empty string and the eligibility check
      # below will not arm auto-merge". Measured 2026-09-03 by EXECUTING the
      # eligibility body with a stubbed `gh`: an empty string makes the path loop
      # read one empty line, `continue`, and finish with `path_excluded=false`, so
      # NOTHING is excluded —
      #   CHANGED_PATHS=""  UPDATE_TYPE=version-update:semver-patch  ECOSYSTEM=docker
      #   -> "PR is eligible" -> gh pr merge --auto --squash   (ARMED)
      # and a `docker`-ecosystem Dependabot PR touches `Dockerfile` BY DEFINITION,
      # which is the first hard-exclude in the list. The exact case the exclude
      # exists for was the case that failed open, and `2>/dev/null` hid the reason.
      #
      # `paths_known` is what makes the claim true: the eligibility step refuses to
      # arm unless the list was actually retrieved. stderr is no longer discarded,
      # so a failure says why.
      - name: Get changed file paths
        id: changed-paths
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if changed=$(gh pr diff "$PR_URL" --name-only); then
            paths_known=true
          else
            echo "::warning::Could not determine the changed paths for this PR — auto-merge will NOT be armed."
            changed=""
            paths_known=false
          fi
          echo "paths_known=${paths_known}" >> "$GITHUB_OUTPUT"
          {
            echo "changed<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Evaluate eligibility and arm auto-merge if eligible.
      #
      # HARD-EXCLUDE (never auto-arm; leave for human review):
      #   - semver-major updates
      #   - Dockerfile / Dockerfile.nginx / any docker base-image file
      #     (prowler/alpine py3.12 freeze — docker majors/alpine bumps must
      #     stay on human review)
      #   - Any PR touching .github/** (workflows, CODEOWNERS, etc.)
      #   - Any PR touching scanner/, hooks/, or scripts/
      #
      # ELIGIBLE (auto-arm) only when ALL hold:
      #   - update-type is semver-patch or semver-minor
      #   - ecosystem is pip or docker
      #   - no hard-excluded path pattern matches
      #
      # `github-actions` USED TO BE LISTED HERE AND WAS UNREACHABLE, twice over.
      # First observed live on PR #460 (a `codeql-action` patch bump), the first
      # real Dependabot PR this workflow ever evaluated:
      #
      #   1. Every github-actions bump edits a `uses:` line under `.github/` by
      #      definition, and the `.github/**` hard-exclude below is evaluated
      #      BEFORE the ecosystem check. #460's log: "PR touches a hard-excluded
      #      path ... Requires human code-owner review", then exit 0.
      #   2. The allowlist arm read `github-actions` with a HYPHEN, while the
      #      metadata action emits an UNDERSCORE — #460's log again:
      #      `outputs.package-ecosystem: github_actions`. So even with the path
      #      exclude removed, the arm could not have matched.
      #
      # Removing the entry rather than repairing it: an actions bump changes what
      # CI itself runs, so human review is the deliberate policy (OWASP CICD-SEC-3
      # — a repointable ref is a supply-chain exposure). Keeping a dead arm that
      # advertises auto-merge for actions patches is worse than not offering it.
      # If that policy ever changes, the `.github/**` exclude must be narrowed in
      # the same commit, and the ecosystem spelled `github_actions`.
      #
      # NOTE: bot approval is intentionally absent, and auto-merge is armed
      # SERVER-SIDE so branch protection remains the only gate. Required checks
      # (Lint, Security Scan Gate) must pass and the branch must be up-to-date
      # (strict mode). Approval is NOT part of that gate: re-verified 2026-08-21,
      # `require_code_owner_reviews=false`, `required_approving_review_count=0`,
      # no repo rulesets. An earlier version of this note asserted a code-owner
      # requirement; that was true when written and is not true now.
      - name: Evaluate eligibility and arm auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          CHANGED_PATHS: ${{ steps.changed-paths.outputs.changed }}
          PATHS_KNOWN: ${{ steps.changed-paths.outputs.paths_known }}
        run: |
          set -euo pipefail

          # ── Hard-exclude: the path list could not be retrieved ────────────
          # FIRST, because every check below reasons about paths and none of them
          # can be trusted without one. This is the branch the old "Fail-closed"
          # comment described and did not implement.
          if [ "${PATHS_KNOWN:-false}" != "true" ]; then
            echo "Changed paths could not be determined — refusing to auto-arm."
            gh pr comment "$PR_URL" --body "Auto-merge was NOT armed: this workflow could not retrieve the list of changed files, so it cannot rule out a sensitive path (Dockerfile, .github, scanner, hooks, scripts). Re-run the workflow, or merge after human review."
            exit 0
          fi

          # ── Hard-exclude: path-based checks ──────────────────────────────
          path_excluded=false
          path_count=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            path_count=$((path_count + 1))
            case "$path" in
              Dockerfile|Dockerfile.nginx|Dockerfile.*)
                path_excluded=true ; break ;;
              .github/*|.github)
                path_excluded=true ; break ;;
              scanner/*|scanner)
                path_excluded=true ; break ;;
              hooks/*|hooks)
                path_excluded=true ; break ;;
              scripts/*|scripts)
                path_excluded=true ; break ;;
            esac
          done <<< "$CHANGED_PATHS"

          if [ "$path_excluded" = "true" ]; then
            echo "PR touches a hard-excluded path (Dockerfile / .github / scanner / hooks / scripts). Requires human code-owner review."
            gh pr comment "$PR_URL" --body "This Dependabot PR touches a sensitive path (Dockerfile, .github, scanner, hooks, or scripts) and is not eligible for auto-merge. Requires human code-owner review."
            exit 0
          fi

          # ── Hard-exclude: the list came back empty ────────────────────────
          # A Dependabot PR always changes at least one file, so zero observed
          # paths means the retrieval succeeded but returned nothing usable —
          # the same "cannot rule out a sensitive path" position as PATHS_KNOWN
          # above, reached by a different route. Checked separately so the two
          # causes stay distinguishable in the log.
          if [ "$path_count" -eq 0 ]; then
            echo "Changed-path list is empty — refusing to auto-arm."
            gh pr comment "$PR_URL" --body "Auto-merge was NOT armed: the changed-file list for this PR came back empty, so this workflow cannot rule out a sensitive path. Re-run the workflow, or merge after human review."
            exit 0
          fi

          # ── Hard-exclude: semver-major ────────────────────────────────────
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            echo "Major version update — requires human code-owner review."
            gh pr comment "$PR_URL" --body "Major version update detected. This PR is not eligible for auto-merge and requires human code-owner review and approval."
            exit 0
          fi

          # ── Eligible update types ─────────────────────────────────────────
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "Unknown or non-eligible update-type: $UPDATE_TYPE — skipping auto-arm."
              exit 0
              ;;
          esac

          # ── Eligible ecosystems ───────────────────────────────────────────
          # `github_actions` is deliberately absent — see the note above. It is
          # already unreachable via the `.github/**` hard-exclude, so this is a
          # second, independent refusal rather than the only one.
          case "$ECOSYSTEM" in
            pip|docker) ;;
            *)
              echo "Ecosystem '$ECOSYSTEM' is not in the auto-arm allowlist (pip, docker) — skipping."
              exit 0
              ;;
          esac

          # ── Arm auto-merge ────────────────────────────────────────────────
          # This only ARMS GitHub's server-side auto-merge feature. The merge
          # will not execute until all required status checks pass AND the
          # branch is up-to-date with main (strict mode). It does NOT wait for a
          # review: `require_code_owner_reviews` and
          # `required_approving_review_count` are both off as of 2026-08-21, so
          # branch protection is the whole gate. That is exactly why the
          # hard-excludes above, not an approval step, are what keep sensitive
          # paths on human review.
          echo "PR is eligible ($UPDATE_TYPE / $ECOSYSTEM). Arming auto-merge (squash)."
          gh pr merge --auto --squash "$PR_URL"
