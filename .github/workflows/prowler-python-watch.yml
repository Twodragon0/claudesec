# Prowler Python Ceiling Watcher
#
# NOTIFICATION-ONLY scheduled workflow that monitors prowler's PyPI metadata
# for prowler's Python ceiling rising far enough to lift the alpine freeze.
# The threshold is **py3.14**, not py3.13: alpine skips py3.13 entirely
# (3.20-3.23 all ship py3.12, 3.24 ships py3.14, measured 2026-08-24), so
# prowler accepting py3.13 unblocks nothing. When py3.14 becomes allowed it
# opens a single GitHub issue to signal
# that the alpine py3.12 freeze can be unblocked.
#
# Background:
#   Dockerfile is pinned to alpine:3.20 (py3.12) + prowler==5.39.1. prowler's
#   requirement was `>=3.10,<3.13` (prowler-cloud/prowler#6737) and is now
#   `>=3.10,<3.14` — still short of the py3.14 that alpine 3.24 ships.
#   .github/dependabot.yml ignores alpine minor/major bumps for the same
#   reason.  This watcher fires when that constraint is relaxed upstream.
#
# Idempotency:
#   Before creating an issue it searches for an existing open issue labelled
#   'prowler-py-watch'.  If one already exists the job logs a note and exits 0.
#
# Fail-safe:
#   Transient network errors (curl failure, empty JSON) cause an exit 0 no-op,
#   NOT a false-positive issue or a noisy failure on the schedule.
#
# This workflow MUST NOT run on pull_request events — it is a scheduled
# notifier only and must not become a required PR status check.

name: Prowler Python Ceiling Watch

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check prowler requires-python ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check prowler Python ceiling
        id: ceiling
        run: |
          set -euo pipefail
          # Run the check script; exit 2 means ceiling lifted, 0 means frozen/error.
          result_code=0
          bash scripts/check-prowler-python-ceiling.sh > /tmp/ceiling-result.txt 2>&1 || result_code=$?

          echo "--- check-prowler-python-ceiling.sh output ---"
          cat /tmp/ceiling-result.txt

          # Parse key=value lines into step outputs
          prowler_version="unknown"
          requires_python="unknown"
          ceiling_lifted="false"

          while IFS='=' read -r key value; do
            case "${key}" in
              PROWLER_VERSION)  prowler_version="${value}" ;;
              REQUIRES_PYTHON)  requires_python="${value}" ;;
              CEILING_LIFTED)   ceiling_lifted="${value}" ;;
            esac
          done < /tmp/ceiling-result.txt

          echo "prowler_version=${prowler_version}" >> "${GITHUB_OUTPUT}"
          echo "requires_python=${requires_python}"  >> "${GITHUB_OUTPUT}"
          echo "ceiling_lifted=${ceiling_lifted}"    >> "${GITHUB_OUTPUT}"

          if [ "${ceiling_lifted}" = "true" ]; then
            echo "CEILING LIFTED: prowler ${prowler_version} now allows py3.14 — the alpine 3.24 line is in range"
          else
            echo "Still frozen: prowler ${prowler_version} requires_python='${requires_python}' — no action needed"
          fi

      - name: Ensure prowler-py-watch label exists
        if: steps.ceiling.outputs.ceiling_lifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh label list --repo "${GITHUB_REPOSITORY}" --json name \
               | python3 -c "
          import sys, json
          labels = [l['name'] for l in json.load(sys.stdin)]
          sys.exit(0 if 'prowler-py-watch' in labels else 1)
          " 2>/dev/null; then
            echo "Creating label prowler-py-watch"
            gh label create prowler-py-watch \
              --repo "${GITHUB_REPOSITORY}" \
              --description "Prowler Python ceiling watcher alert" \
              --color "e4e669"
          else
            echo "Label prowler-py-watch already exists"
          fi

      - name: Check for existing open alert issue
        id: existing_issue
        if: steps.ceiling.outputs.ceiling_lifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "prowler-py-watch" \
            --state open \
            --json number,title \
            --limit 5)"

          echo "Existing open prowler-py-watch issues: ${existing}"

          count="$(echo "${existing}" | python3 -c 'import sys, json; print(len(json.load(sys.stdin)))')"
          if [ "${count}" -gt 0 ]; then
            echo "issue_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "issue_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Write issue body to file
        if: >-
          steps.ceiling.outputs.ceiling_lifted == 'true' &&
          steps.existing_issue.outputs.issue_exists == 'false'
        env:
          PROWLER_VERSION: ${{ steps.ceiling.outputs.prowler_version }}
          REQUIRES_PYTHON: ${{ steps.ceiling.outputs.requires_python }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, textwrap
          v  = os.environ["PROWLER_VERSION"]
          rp = os.environ["REQUIRES_PYTHON"]
          body = textwrap.dedent(f"""\
          ## Prowler now allows py3.14 — the alpine freeze can be lifted

          The watcher detected that **prowler** no longer excludes Python 3.14.

          | Field            | Value |
          |------------------|-------|
          | Detected version | {v} |
          | requires_python  | `{rp}` |
          | Detected by      | prowler-python-watch scheduled workflow |

          ## Why the threshold is py3.14 and not py3.13

          The freeze exists so the shipped image's Python stays inside prowler's
          supported range. What matters is therefore the Python that the NEXT alpine
          minor ships — measured 2026-08-24 by installing `python3` in each image:

          | alpine | Python |
          |--------|--------|
          | 3.20   | 3.12.13 |
          | 3.21   | 3.12.14 |
          | 3.22   | 3.12.14 |
          | 3.23   | 3.12.14 |
          | 3.24   | **3.14.7** |

          alpine skips py3.13 entirely and jumps 3.12 -> 3.14 at the 3.23/3.24 boundary.
          So prowler accepting py3.13 unblocked nothing — this alert previously fired on
          that condition (issue #295) and then stayed latched true forever, which is why
          it now tests for py3.14.

          ## Unblock steps

          1. **Re-measure first.** Run
             `docker run --rm alpine:3.24 sh -c 'apk add --no-cache python3 >/dev/null 2>&1; python3 --version'`
             and confirm the Python it ships is inside `{rp}`. Do not infer it.
          2. **Update `Dockerfile`**: bump both `FROM alpine:3.20@sha256:...` lines to the
             new minor WITH its digest, and bump `ARG PROWLER_VERSION` to the release that
             declares the wider support.
          3. **Update `scanner/tests/test_ci_dockerfile_base_pinned.py`**: it asserts
             `alpine:3.20@sha256:` explicitly, so the bump trips it by design.
          4. **Update `.github/dependabot.yml`**: loosen the `alpine` `update-types` ignore
             only if a bump can no longer cross prowler's ceiling. Dependabot cannot tell a
             safe minor from the one that crosses it, so keeping the ignore and bumping by
             hand stays the safer posture.
          5. **Bump `TARGET_PY_MINOR`** in `scripts/check-prowler-python-ceiling.sh` to the
             Python minor of the *next* alpine line, or this alert latches true again.
          6. **Verify by building, not by reading**: `docker build -t claudesec:verify .`,
             then `docker run --rm --entrypoint sh claudesec:verify -c 'prowler --version'`
             (it must RUN, not merely install), `bash scanner/tests/test_prowler_provider_build_parity.sh`,
             and check the image against the 600 MB gate in `dashboard-regression-check`.

          ## References

          - `Dockerfile` — the measured alpine/Python table lives in the pin comment
          - `.github/dependabot.yml` — alpine `update-types` ignore and its rationale
          - `scripts/check-prowler-python-ceiling.sh` — `TARGET_PY_MINOR`
          - PR #220 — alpine 3.20->3.24 built green and prowler was broken at runtime
          """)
          with open("/tmp/issue-body.md", "w") as f:
              f.write(body)
          print("Issue body written to /tmp/issue-body.md")
          PYEOF

      - name: Open alert issue (ceiling lifted, no existing issue)
        if: >-
          steps.ceiling.outputs.ceiling_lifted == 'true' &&
          steps.existing_issue.outputs.issue_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "chore(docker): prowler now supports Python 3.13+ -- unblock alpine freeze" \
            --label "prowler-py-watch" \
            --body-file /tmp/issue-body.md

      - name: Skip (duplicate issue already open)
        if: >-
          steps.ceiling.outputs.ceiling_lifted == 'true' &&
          steps.existing_issue.outputs.issue_exists == 'true'
        run: |
          echo "An open prowler-py-watch issue already exists — skipping duplicate creation."
