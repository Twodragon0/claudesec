name: DAST Full Scan (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: >-
          Optional. An authorized external target. LEAVE EMPTY to scan this
          repo's own dashboard container, which is what the nightly run does.
          Pointing an ACTIVE scan at infrastructure you do not own requires
          documented authorization (NIST SP 800-115); never a third party, never
          production.
        required: false

permissions:
  contents: read
  issues: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # NOTE ON THE REMOVED `coverage-notice` JOB (#399, 2026-08-26)
  # ---------------------------------------------------------------------------
  # The scan used to be gated on the `DAST_TARGET_URL` repo variable. With the
  # variable unset the job was SKIPPED, the workflow conclusion was a clean
  # `skipped`, and nothing was red — so this workflow promised nightly coverage
  # it was not delivering. Measured 2026-08-06: 42 consecutive nightly runs
  # reported `skipped` after the variable was unset around 2026-06-25, i.e. six
  # weeks of ZERO automated DAST, with `gh api .../actions/variables` returning
  # total_count: 0. `coverage-notice` existed to make that state visible without
  # deciding the underlying question.
  #
  # The question is now decided: the nightly scans THIS REPO'S OWN dashboard
  # container, the same target `dast-baseline.yml` already uses on pull requests.
  # So the gate is gone, the run cannot skip, and a notice about a missing
  # variable would be actively wrong — it would report "not running" on every
  # night the scan ran fine.
  #
  # THE HALF THAT REMOVAL LEFT UNWATCHED, and where it now lives. `skipped` was
  # only one way this workflow can stop delivering; the other is that the
  # schedule never fires — GitHub disables every `schedule:` after 60 days of
  # repo inactivity, `gh workflow disable` is one command, and cron delivery is
  # best-effort (a ~10h delay is already on record here, run 33070461602). Then
  # there is no run at all, so nothing is skipped, nothing is red, and the
  # history just ends. That cannot be checked from inside this file — if the
  # cron is dead the check is dead with it — so it lives in
  # `.github/workflows/dast-freshness-watch.yml`, which watches the AGE of the
  # newest successful `event=schedule` run here and also runs on `push` to
  # `main` so it does not depend on the mechanism it is watching.
  #
  # What this deliberately does NOT do is restore an external target. An active
  # full scan against a host you do not own needs documented authorization
  # (NIST SP 800-115), and the placeholder-host incident (#283) is what a default
  # target buys. `workflow_dispatch` still accepts one for an authorized run.
  #
  # HONEST LIMIT: the nightly now scans a static page served by the repo's own
  # nginx, which `dast-baseline.yml` already scans per PR. The added signal is the
  # active-attack ruleset over the same surface, not new surface. That is a real
  # reduction in claimed coverage versus scanning a live staging deployment —
  # traded for a run that actually happens and cannot scan someone else's host.
  #
  # The invariant that replaced the notice job is pinned by
  # `scanner/tests/test_ci_security_gate.py`: this job must not be gated on a
  # repo variable, and the target must fall back to the local container.
  # ---------------------------------------------------------------------------
  dast-full:
    runs-on: ubuntu-latest
    # `environment: staging` is kept for the workflow_dispatch-with-external-target
    # path, which is the only one that touches a real deployment. It has ZERO
    # protection rules today (verified via `gh api .../environments`), so it does
    # not gate the nightly. If reviewers are ever added to it, the nightly
    # localhost scan starts waiting for approval — decide that deliberately.
    environment: staging
    # DELIBERATELY UNGATED. A repo-variable gate is what made 42 consecutive
    # nightly runs report a clean `skipped`; see the note above the job.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The three steps below run only for the local target. Same shape as
      # dast-baseline.yml: the dashboard is static, so placeholder files are
      # enough to give nginx something to serve.
      - name: Generate dashboard files for mount
        if: github.event.inputs.target_url == ''
        run: |
          echo '<!DOCTYPE html><html><body>DAST target</body></html>' > claudesec-asset-dashboard-live.html
          echo '<!DOCTYPE html><html><body>DAST scan dashboard</body></html>' > claudesec-dashboard.html
          echo '{}' > scan-report.json
          mkdir -p .claudesec-assets

      - name: Start application (docker-compose)
        if: github.event.inputs.target_url == ''
        run: |
          docker compose up -d dashboard
          timeout 60 bash -c 'until curl -sf http://localhost:11777/; do sleep 2; done'

      - name: Prepare workspace for ZAP
        if: github.event.inputs.target_url == ''
        run: chmod -R a+w .

      - name: ZAP Full Scan
        # VERDICT SUPPRESSED — WHAT IT HIDES: `continue-on-error` stops a ZAP
        # non-zero exit from failing the job. Unlike dast-baseline.yml this one is
        # COMPENSATED: the status is preserved as `steps.zap.outcome` and re-raised
        # by "Notify on Critical Findings" (`if: steps.zap.outcome == 'failure'`)
        # below, so findings still reach a human. What remains lost is the
        # distinction between "ZAP found something" and "ZAP could not run" — both
        # surface as `outcome == 'failure'` and produce the same notification.
        # If that notify step is ever removed, this becomes a silent suppression.
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c  # v0.13.0
        id: zap
        continue-on-error: true
        with:
          # No repo variable and no placeholder host: an empty input means the
          # local container, which is always there. `vars.DAST_TARGET_URL` is
          # deliberately NOT read — reading it would restore the gate's failure
          # mode by the back door (a stale variable silently redirecting the
          # nightly at whatever host it names).
          target: ${{ github.event.inputs.target_url || 'http://localhost:11777' }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: >-
            -z "-config scanner.maxScanDurationInMins=30"
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: "ZAP Full Scan Report"
          artifact_name: "zap-full-scan-report"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-full-scan-results
          path: |
            report_html.html
            report_json.json
            zap_scan.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('zap_scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: zap_scan.sarif
          category: "DAST"

      # RED-WHILE-FIXED: the tracker body froze on the day it was opened.
      # ---------------------------------------------------------------------------
      # `zaproxy/action-full-scan` opens ONE issue titled by `issue_title:` and, on
      # every later run, APPENDS a comment listing only the delta ("New Alerts" /
      # "Resolved Alerts"). It never rewrites the body. So the body is a permanent
      # snapshot of the FIRST run that found anything, and that is the part a reader
      # sees first.
      #
      # Measured on #498: body dated 2026-08-26 listing `CSP: style-src
      # unsafe-inline` plus missing COEP/COOP/CORP as live, while the issue's own
      # 2026-08-28 comment reported all four under "Resolved Alerts" — #500 had
      # fixed them on 08-27. Anyone opening the issue read four current MEDIUM
      # findings that had not existed for four days.
      #
      # That is the mirror image of the failure class the rest of this repo's CI
      # guards exist for. Green-while-defeated hides a real problem behind a
      # reassuring surface; red-while-fixed hides a real ALL-CLEAR behind an alarming
      # one, and it costs the same thing — a reader who trusts the surface stops
      # trusting the signal. A tracker that cries wolf gets muted, which is how the
      # nightly went 42 nights unwatched in the first place (#399).
      #
      # This step does NOT disable the action's issue writing. The comment stream is
      # genuinely useful — a delta is information the body cannot carry. Only the
      # body is wrong, so only the body is replaced, with the current run's full
      # state and a line saying it is regenerated. The action still owns creation;
      # if the issue does not exist yet there is nothing to refresh and this is a
      # no-op, which is why it never creates one itself.
      - name: Refresh ZAP tracker body
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          # Read through `env`, never interpolated into the script body with
          # `${{ }}`. This value is a trusted enum, but the repo's remediation for
          # CWE-94 (#349) is env-vars-not-interpolation applied uniformly — a rule
          # with a "but this one is safe" carve-out is a rule the next author has to
          # re-derive.
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        with:
          script: |
            const fs = require('fs');
            // Must equal the `issue_title:` given to the ZAP action above; pinned by
            // scanner/tests/test_ci_dast_tracker_body_refresh.py so the two cannot
            // drift apart into a silent no-op.
            const TRACKER_TITLE = 'ZAP Full Scan Report';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const tracker = all.find(
              (i) => i.title === TRACKER_TITLE && !i.pull_request,
            );
            if (!tracker) {
              core.info(`No "${TRACKER_TITLE}" issue exists yet — nothing to refresh.`);
              return;
            }

            const RISK = { 3: 'High', 2: 'Medium', 1: 'Low', 0: 'Informational' };
            let snapshot;
            try {
              const raw = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
              const alerts = (raw.site || []).flatMap((s) => s.alerts || []);
              const counts = alerts.reduce((acc, a) => {
                acc[a.riskcode] = (acc[a.riskcode] || 0) + 1;
                return acc;
              }, {});
              const rows = alerts
                .slice()
                .sort((a, b) => Number(b.riskcode) - Number(a.riskcode))
                .slice(0, 50)
                .map(
                  (a) =>
                    `| ${RISK[a.riskcode] || a.riskcode} | ${a.name} | ` +
                    `${a.instances?.length || 0} |`,
                );
              snapshot =
                `Risk breakdown — High: ${counts[3] || 0}, Medium: ${counts[2] || 0}, ` +
                `Low: ${counts[1] || 0}, Informational: ${counts[0] || 0}\n\n` +
                (rows.length
                  ? `| Risk | Alert | Instances |\n| --- | --- | --- |\n` +
                    `${rows.join('\n')}\n` +
                    (alerts.length > 50
                      ? `\n_${alerts.length - 50} further alert(s) omitted; ` +
                        `see the run artifacts._\n`
                      : '')
                  : `No alerts reported by this run.\n`);
            } catch (err) {
              // "I could not read the report" must never render the same as
              // "I read it and the site is clean" — the distinction #502 was built
              // to preserve. Say which one this is.
              snapshot =
                `> **This run could not read \`report_json.json\`** ` +
                `(\`${err.message}\`).\n>\n` +
                `> This is NOT a statement that the target is clean — it is a ` +
                `statement that this run could not tell. Check the workflow run ` +
                `and its artifacts.\n`;
            }

            const body =
              `<!-- Regenerated by dast-full-scan.yml on every run. Do not hand-edit. -->\n` +
              `**This body always reflects the most recent nightly full scan.** ` +
              `The comments below are per-run deltas written by ` +
              `\`zaproxy/action-full-scan\` (new vs resolved alerts) and are kept ` +
              `as history.\n\n` +
              `- Run: ${runUrl}\n` +
              `- Refreshed (UTC): ${new Date().toISOString()}\n` +
              `- ZAP step outcome: \`${process.env.ZAP_OUTCOME}\`\n\n` +
              `${snapshot}\n` +
              `Full HTML/JSON/SARIF reports are attached to the workflow run ` +
              `artifacts; SARIF is also published to the Security tab ` +
              `(category \`DAST\`).`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tracker.number,
              body,
            });
            core.info(`Refreshed issue #${tracker.number} body from run ${context.runId}.`);

      - name: Notify on Critical Findings
        if: steps.zap.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const TRACKER_TITLE = '[DAST] Full Scan — open critical/high findings';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            // Parse the ZAP JSON report so the issue carries real detail instead
            // of "check the artifacts". riskcode 3 = High, 2 = Medium.
            let summary = '';
            try {
              const raw = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
              const alerts = (raw.site || []).flatMap((s) => s.alerts || []);
              const counts = alerts.reduce((acc, a) => {
                const r = String(a.riskcode);
                acc[r] = (acc[r] || 0) + 1;
                return acc;
              }, {});
              const high = alerts
                .filter((a) => String(a.riskcode) === '3')
                .map((a) => `- **${a.name}** (${a.instances?.length || 0} instance(s))`)
                .slice(0, 25);
              summary =
                `Risk breakdown — High: ${counts['3'] || 0}, ` +
                `Medium: ${counts['2'] || 0}, Low: ${counts['1'] || 0}\n\n` +
                (high.length ? `### High-risk alerts\n${high.join('\n')}\n` : '');
            } catch (err) {
              summary = `_Could not parse report_json.json: ${err.message}_\n`;
            }

            const body =
              `DAST Full Scan reported critical/high findings.\n\n` +
              `- Run: ${runUrl}\n` +
              `- Date (UTC): ${new Date().toISOString().split('T')[0]}\n\n` +
              `${summary}\n` +
              `Full HTML/JSON/SARIF reports are attached to the workflow run artifacts; ` +
              `SARIF is also published to the Security tab (category \`DAST\`).`;

            // Deduplicate: reuse a single open tracker issue instead of opening a
            // new dated issue every night. Comment on it (and reopen if closed)
            // rather than piling up duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'dast',
              per_page: 100,
            });
            const tracker = existing.data.find((i) => i.title === TRACKER_TITLE);

            if (tracker) {
              if (tracker.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TRACKER_TITLE,
                labels: ['security', 'dast', 'critical'],
                body,
              });
            }

      - name: Teardown
        if: always() && github.event.inputs.target_url == ''
        run: docker compose down
