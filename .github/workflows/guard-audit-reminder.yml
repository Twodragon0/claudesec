# Quarterly CI-Guard Adversarial Audit Reminder
#
# Operationalizes the periodic-audit cadence from ADR-001
# (docs/devsecops/adr-001-ci-guard-hardening-and-audit-cadence.md): every quarter,
# open a single idempotent reminder issue to run a comprehensive adversarial
# audit of all scanner/tests/test_ci_*.py guards — catching older guards that
# predate a hardening primitive (the comment-evasion false-negative class).
#
# This is a SCHEDULED NOTIFIER, not a gate: it must never run on pull_request /
# pull_request_target and must never become a required status check (mirrors
# provenance-verify.yml / protection-drift-watch.yml). It opens an issue; a human
# runs the audit. Idempotent: if an open `guard-audit-due` issue already exists,
# it does nothing (no duplicate spam).

name: Guard Audit Reminder

on:
  schedule:
    # 09:00 UTC on the 1st of Jan / Apr / Jul / Oct (quarterly).
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    name: Open quarterly guard-audit reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open reminder issue (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ensure the label exists (no-op if it already does).
          gh label list --repo "${GITHUB_REPOSITORY}" --json name \
            | python3 -c "import sys,json; sys.exit(0 if 'guard-audit-due' in [l['name'] for l in json.load(sys.stdin)] else 1)" 2>/dev/null \
            || gh label create guard-audit-due --repo "${GITHUB_REPOSITORY}" \
                 --description "Quarterly ADR-001 CI-guard adversarial audit due" --color "1d76db"

          # Idempotent: skip if an open reminder already exists.
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label guard-audit-due --state open --json number --limit 5)"
          if [ "$(echo "$existing" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" -gt 0 ]; then
            echo "An open guard-audit-due issue already exists — skipping duplicate."
            exit 0
          fi

          {
            echo "## Quarterly CI-guard adversarial audit due (ADR-001)"
            echo ""
            echo "Run a comprehensive adversarial audit of every"
            echo "\`scanner/tests/test_ci_*.py\` guard, per the cadence in ADR-001"
            echo "(\`docs/devsecops/adr-001-ci-guard-hardening-and-audit-cadence.md\`)."
            echo ""
            echo "### Checklist"
            echo "- [ ] Confirm baseline: \`pytest scanner/tests/test_ci_*.py scanner/tests/test__ci_guard_util.py -q\` is green."
            echo "- [ ] Adversarially review each guard for the comment-evasion false-negative class (token surviving only in a \`#\` comment, unhandled YAML form)."
            echo "- [ ] Confirm every presence/regex check routes through the \`_ci_guard_util\` comment-stripping primitives."
            echo "- [ ] Confirm every detector has a non-vacuous mutation self-test — MUTATE the real file, run the suite, and SEE it fail. A detector that always returns \`[]\` is indistinguishable from a passing one until you do."
            echo "- [ ] Score the mutation per ASSERTION, not per suite run. Enumerate the absence assertions — \`grep -rnF ', [])' scanner/tests/test_ci_*.py\` plus \`grep -rnF ', set())' …\` (55 hits on \`21edb45\`; over-broad on purpose, classify then subtract) — and confirm each empty baseline is PAIRED with a non-empty assertion on the same detector. An absence assertion proves nothing until you have watched the forbidden thing HAPPEN; without the pair it certifies whichever unrelated mechanism aborted first. #431's advertised security assertion stayed green with the validation deleted (\`set -u\` aborted on an unset array before the payload ran) while the SIBLING assertion in the same file went red — which is exactly why nobody re-read it. Violation: an empty-baseline assertion whose only evidence is a red somewhere else in the run. Class writeup, with the measured four-row table, is item 8 of the probe checklist in \`.claude/skills/ci-config-guard-claudesec/SKILL.md\` (#432) — read it there, it is not restated here."
            echo "- [ ] Treat every behavioural claim written in PROSE inside a test file as a claim to discharge: it must name the assertion (test name, or file:line) that proves it, or be deleted. #431's \`test_gh_rerun_stuck_checks.py\` said \"the caller passes \`--stuck-minutes\` through\" in a comment while no test checked the caller — deleting the caller's flag survived 57/57 green, and it failed in the dangerous direction (the log announced the operator's threshold while the detector used its own default). Violation: a comment stating behaviour with no named assertion beside it."
            echo "- [ ] BEFORE believing any \"GAP\" verdict, prove the MUTATION actually disables the control. A probe that does not really break anything makes a correct guard look broken, and you will \"fix\" a guard that was right. In the 2026-08-10 sweep three probes were wrong before they were right: a \`case\` arm moved just ABOVE the \`*)\` catch-all (still reachable), a section header edited instead of the entry under it, and a job-block test written only for end-of-file when the discriminating case was a following top-level key. Attack the harness first."
            echo "- [ ] For any guard that proves an invariant by EXECUTING something: list the text the executed process cannot see (step \`if:\` / \`continue-on-error:\` / job-level keys are consumed by the runner, never by the shell). That list is the remaining surface — execution moves the boundary of the proof, it does not remove one."
            echo "- [ ] For any guard covering a REQUIRED status check: scope it to the transitive \`needs:\` closure, not to the one job or step in front of you. Both required contexts are aggregators."
            echo "- [ ] For any scope decision argued from 'this shape is common/rare': NAME THE POPULATION and count it. Sizing against the whole repo instead of against the guarded graph is what left the step-level \`if:\` hole in #407."
            echo "- [ ] Counting the population is not enough — prove the ENUMERATOR sees all of it, and record its recall. The item above was satisfied and still wrong: ADR-001 carried \"67 references\" for weeks while the real population was 81, written FIVE ways, of which the numbering guard's regex matched 64 (#434). All five never-triaged citation errors sat in the 17 sites that regex could not see, so the blind spot was not incidental — it is WHY they survived three sweeps. Sweep deliberately over-broad first, then subtract with a stated rule, and publish both numbers. Violation: a population size quoted without the enumerator that produced it, or an enumerator whose recall against a broader sweep was never measured."
            echo "- [ ] Diff \`ls .github/workflows/\` against the workflow names appearing in \`docs/devsecops/ci-config-regression-guards.md\` — a workflow mentioned nowhere is neither guarded nor consciously un-guarded (this is how the \`guard-audit-reminder.yml\` Tier-3 gap was found)."
            echo "- [ ] Enumerate every place CI converts a FAILURE into a WARNING, and state per site what is silently lost. \`grep -rnE 'continue-on-error|::warning::|--accept|\|\| *(true|:)' .github/workflows/\` — 42 hits on \`21edb45\`, most benign empty-output captures and some of them prose (this checklist's own text matches), so classify each rather than counting. A converted failure reads GREEN: the kcov job treats \`rc=124\` as a warning, so a watchdog bug that pushed a test onto the documented 30s cap surfaced only as \`elapsed=30s rc=124\` inside a green job (#431), and the same class had already let a no-op job read green (#396/#397 — its fix comment is the standing example, \`protection-drift-watch.yml:24\`). Start from the known verdict-suppressing sites: kcov \`124\`, HIGH findings (only CRITICAL blocks), dashboard quality below threshold, lychee \`--accept '100..=599'\` (a 404 passes the required \`Lint\`), the \`provenance-verify\` install fallback. Violation: a site that suppresses a verdict with no comment stating what it hides."
            echo "- [ ] Attack the EXTRACTOR, not just the matcher: for every block collector, plant a \`#\` comment at the threshold column and re-run. A comment ends no mapping (PyYAML: \`a:/  x: 1/# c/  y: 2\` -> both keys), so a collector that breaks there hides every key after it — three live bypasses in #419, two of them defeating the guards written for that key."
            echo "- [ ] Never hand-roll a block terminator or a \`min(indent)\` column derivation: use \`_ci_guard_util.block_ends_at\` / \`key_column\`. Five copies of the latter existed and every one was wrong once comments could live inside a block."
            echo "- [ ] Match the collector to the GRAMMAR it reads. In a block/folded scalar a \`#\` is content and a less-indented one is a ParserError, so \`extract_run_block\` breaking there is CORRECT — \"fixing\" it for consistency over-captures shell out of a workflow file."
            echo "- [ ] After fixing a shared primitive, RE-RUN the existing mutation tests before reviewing the diff. #419's second-order defect (poisoned column derivations) surfaced as \`28 passed\` -> \`1 failed\`, not in review."
            echo "- [ ] Placement decides a probe's verdict: a mutation at the START of a block can truncate unrelated keys away and read as \"caught\". Put it where an author regrouping keys would — at the END of the block it terminates."
            echo "- [ ] Do not file \"no observable effect\" as a verdict. Find the REASON: in #420 the immunity was one \`strip_comment_lines\` call in \`setUpClass\`, i.e. in the CALLER, and nothing asserted it. Pin the reason where it lives."
            echo "- [ ] When recording a guard as CLEAN, record the CLASS it is clean for. A verdict scoped to one class reads as unqualified six weeks later."
            echo "- [ ] DERIVE the state of every status table in the audit trail and DIFF it — never eyeball-scan one. \`git log --format='%h %s' origin/main\` + \`gh pr list --state merged --json number,mergedAt,mergeCommit\` against the rows. #433 did this to the 2026-08 cycle retrospective and found \`OPEN\` rows for two already-merged PRs in TWO separate tables, plus a missing row for #418 — the PR that CREATED the document — which sorts between two existing rows and so is invisible to a scan of the same date block. Twelve lines above those stale rows sat a sentence saying that writing \"currently open\" attaches an expiry: the expiry is not self-enforcing, and the method is #425's. Violation: a status reconciled by reading instead of by a diff against derived state — including a derivation that changed nothing and was not recorded as a verified negative."
            echo "- [ ] Update the 'Unguarded invariants backlog' review date in \`docs/devsecops/ci-config-regression-guards.md\`."
            echo "- [ ] Before proposing a NEW guard, read the REJECTED-control record and say why yours is different. Declined so far: a mechanical \"never pass raw text to an extractor\" detector, whose exception list would be longer than its findings (#424); a \"promotion-watch\" guard for the auxiliary scheduled workflows (catalog Tier 3, 2026-06-19); and — twice, by two independent reviews — a date-vs-snapshot \"vintage\" guard for ADR citations (#434), because its cause is extinct (zero pre-cutoff citations name a decision that did not exist yet) and the agreed control is the one-sided lockstep pin already in \`test_ci_adr_decision_numbering.py\` plus the cheap widening of its citation-spelling regex. Violation: a proposed guard with no named incident and no estimate of its exception list."
            echo "- [ ] File follow-up PRs for any finding; close this issue when the backlog is triaged."
            echo ""
            echo "Checklist rationale: \`docs/reports/runner-key-audit-retrospective.md\` (#404 → #408) and \`docs/reports/guard-audit-cycle-2026-08-retrospective.md\` (#418 → #434)."
            echo ""
            echo "Reference: OWASP CICD-SEC-1 (Insufficient Flow Control); NIST SSDF (SP 800-218) PO.3/PW.4."
          } > /tmp/body.md

          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "chore(ci): quarterly ADR-001 guard adversarial audit due" \
            --label guard-audit-due \
            --body-file /tmp/body.md
