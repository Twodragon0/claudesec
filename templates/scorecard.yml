# .github/workflows/scorecard.yml
# ClaudeSec template — OpenSSF Scorecard for repository security health
#
# EXAMPLE workflow — NOT installed by scripts/setup.sh; copy it deliberately.
# The `uses:` refs below are tag-pinned for readability and because ClaudeSec
# does not run these actions itself, so it has no Dependabot signal to keep a
# SHA fresh here — a stale pin shipped as advice is worse than a visible tag.
# Pin each to a 40-hex commit SHA when you adopt it (OWASP CICD-SEC-3): a tag
# is mutable and can be repointed at attacker code.

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
