# Response headers that every dashboard location must carry.
#
# WHY A SHARED FILE. nginx `add_header` is REPLACED, not merged, by a nested
# block: the moment a `location` declares one `add_header` of its own it stops
# inheriting the server-level set entirely. So a per-location Cache-Control
# forces that location to restate the whole security set, and the file drifted
# exactly as that invites — `location ^~ /.claudesec-assets/` restated two of
# the five and silently served its JSON without X-Frame-Options,
# X-XSS-Protection, Referrer-Policy or Permissions-Policy.
#
# That drift is why the 2026-08-26 nightly ZAP full scan reported
# Cross-Origin-Resource-Policy missing on NINE URLs rather than one: the header
# has to be on every response, and a per-location copy is a per-location chance
# to forget it. Including one file makes "identical across locations" structural
# instead of a review obligation. Pinned by
# scanner/tests/test_ci_nginx_security_headers.py and asserted over the wire by
# the `Docker Dashboard Smoke Test` job in .github/workflows/lint.yml.
#
# `always` on each header so it is emitted on error responses (4xx/5xx) too,
# not just 2xx/3xx.

# --- Site isolation (Spectre) -----------------------------------------------
# Added 2026-08-27 for ZAP rule 90004 "Insufficient Site Isolation Against
# Spectre Vulnerability". The dashboard is static and entirely same-origin — its
# meta-CSP is `default-src 'none'` with `img-src 'self' data: blob:` and
# `connect-src 'self'` — so none of the three costs it a subresource.
#
# Fetch Metadata / cross-origin isolation guidance: OWASP Secure Headers
# Project; W3C Fetch Metadata Request Headers.
#
# COEP `require-corp` is the only one with teeth for subresources: it demands
# every CROSS-origin subresource opt in via its own CORP header. Same-origin
# resources need no opt-in, and the CSP above already forbids cross-origin
# subresources outright, so this restricts nothing the page actually loads.
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# --- Pre-existing baseline ---------------------------------------------------
# CSP is deliberately NOT here: it is set via the HTML `<meta http-equiv>` tag
# so the nonce can be substituted per-request by `sub_filter` (see the
# `\.html$` location), and a header copy would conflict rather than combine.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# Explicitly 0, not 1: the legacy XSS Auditor introduced its own vulnerabilities
# and is disabled by every current browser. The real control is the meta-CSP.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
