# CI config regression guard INVENTORY — the machine-readable half of
# `docs/devsecops/ci-config-regression-guards.md`.
#
# WHY THIS FILE EXISTS
#   Three guards used to read that published Markdown document as a database.
#   That put the whole Markdown scan-evasion class between a guard and the
#   invariant it asserts: a row hidden in a closed comment, a code fence, an
#   HTML block, or after an unterminated comment opener renders as nothing a
#   reader can act on while a raw substring scan still finds it. Two PRs (#528,
#   #529) patched the reduction; the second still left a measured 14 silent-pass
#   shapes, because the divergence is a TWO-LAYER problem (markdown -> HTML ->
#   browser) that a stdlib regex cannot model.
#
#   ADR-001 §5 says to invert rather than patch an enumeration a third time. So
#   the inventory moved here, and the strong invariant — every guard on disk is
#   inventoried — now has NO Markdown anywhere in its path.
#
# WHAT IS AND IS NOT HERE
#   Only the fields a machine compares. Every verdict, rationale and incident
#   note stays in the Markdown, where it is readable and reviewable; moving
#   3000-character prose verdicts into TOML would wreck authoring and buy
#   nothing.
#
# THE DOC IS STILL CHECKED, MORE WEAKLY, AND ON PURPOSE
#   `test_ci_catalog_doc_sync.py` is the ONLY remaining reader of the prose and
#   asserts set equality against this file. It still goes through
#   `rendered_markdown`, so it still carries that residual — but its failure
#   mode is now documentation drift, not a guard certifying an inventory that
#   does not exist. To degrade the published catalog you must now ALSO edit this
#   file, and doing that fails the on-disk checks in
#   `test_ci_catalog_completeness.py` outright.
#
# EDITING
#   Add a guard here in the same commit that adds the guard, and add its row to
#   the Markdown. Both are checked. Keep the lists sorted; a guard pins that.
#
# Parsed with `tomllib` (stdlib >= 3.11; the `ci-guards` job pins 3.11 and
# installs nothing).

